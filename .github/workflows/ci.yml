name: ci

on:
  push:
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd sdk && npm install && npm test

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd sdk && npm install && npm run build
      - run: cd demo && npm install && npm run lint

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path contracts/verifier/Cargo.toml --locked
      - run: cargo test --manifest-path contracts/registry/Cargo.toml --locked
