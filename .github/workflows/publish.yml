name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # The SDK's contract types are generated from the compiled contract's
      # own spec, so publishing needs the contract built first.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - run: npm ci

      - name: Build verifier release wasm
        run: cargo build --manifest-path contracts/verifier/Cargo.toml --target wasm32v1-none --release --locked

      - run: npm run lint --workspace=sdk

      - run: npm run codegen:check --workspace=sdk

      - run: npm test --workspace=sdk

      - run: npm run build --workspace=sdk

      - run: npm publish --workspace=sdk --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
