[package]
name = "zksoroban-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib is needed alongside cdylib so tests/cost_regression.rs (an
# integration test, compiled as a separate crate) can `use
# zksoroban_verifier::{...}` — cdylib alone can't be linked as a normal
# Rust dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.0"
zksoroban-verifier-interface = { path = "../verifier-interface" }

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils"] }
rand = "0.8"
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
